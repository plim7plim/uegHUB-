<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UEG Hub | Feed</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-page {
      width: min(700px, 92vw);
      margin: 0 auto;
      padding: 50px 0;
    }

    .profile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logout-button {
      padding: 10px 16px;
      border: 1px solid rgba(132, 173, 207, 0.15);
      border-radius: 10px;
      color: #9db1c3;
      background: rgba(255, 255, 255, 0.025);
      font: 600 12px "Inter", sans-serif;
      cursor: pointer;
    }

    .logout-button:hover {
      color: white;
      border-color: rgba(70, 180, 255, 0.3);
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .tag {
      padding: 7px 11px;
      border: 1px solid rgba(132, 173, 207, 0.15);
      border-radius: 9px;
      color: #9db1c3;
      background: rgba(2, 9, 17, 0.42);
      font: 11px "Inter", sans-serif;
    }

    .profile-section {
      margin-top: 20px;
    }

    .profile-section h3 {
      color: #d6e1eb;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .empty-tag {
      color: #5d7487;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="background-grid"></div>
  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <main class="profile-page">
    <section class="auth-card" id="profileCard">
      <p class="card-description">Carregando seu perfil...</p>
    </section>
  </main>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
